<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoveBud Image Slideshow</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>LoveBud Gallery</h1>
        <p class="subtitle">Exploring the visual journey of the LoveBud ecosystem through immersive snapshots.</p>
        
        <div class="filters" id="filters">
            <button class="filter-btn active" data-filter="all">All Items</button>
            <button class="filter-btn" data-filter="community">Community</button>
            <button class="filter-btn" data-filter="editor">Editor</button>
            <button class="filter-btn" data-filter="mobile">Mobile</button>
            <button class="filter-btn" data-filter="home">Home</button>
            <button class="filter-btn" data-filter="old">Archive</button>
            <button class="filter-btn" data-filter="slide">Slides</button>
        </div>
    </header>

    <main class="slider-container">
        <div class="counter" id="counter">1 / 34</div>
        
        <button class="nav-btn prev-btn" id="prevBtn">
            <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        
        <div class="slide-wrapper" id="slideWrapper">
            <!-- Slides will be injected here -->
        </div>

        <button class="nav-btn next-btn" id="nextBtn">
            <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>

        <div class="indicators" id="indicators">
            <!-- Dots will be injected here -->
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
